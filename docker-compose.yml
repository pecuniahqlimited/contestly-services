# Local infrastructure. Services run with `npm run dev` on your machine so you get hot reload;
# run them in Docker too with `docker compose --profile services up`.
name: contestly-services

services:
  postgres:
    # pgvector-enabled Postgres for question-bank retrieval. The init script only runs on a
    # fresh volume: after switching images, `docker compose down -v` once, then infra:up + db:migrate + db:seed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contestly
      POSTGRES_PASSWORD: contestly
      POSTGRES_DB: contestly
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contestly"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [valkeydata:/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible object storage (DO Spaces in production). Dev-only credentials in docker/seaweedfs/s3.json.
  storage:
    image: chrislusf/seaweedfs:latest
    # Small volumes so a laptop disk fits the volumes SeaweedFS pre-grows per bucket.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=50", "-master.volumeSizeLimitMB=64"]
    ports: ["8333:8333"]
    volumes:
      - storagedata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    # The port opens before the S3 API is ready; infra:up --wait holds until this passes.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["services"]
    build: { context: ., args: { APP: api } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://contestly:contestly@postgres:5432/contestly
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://storage:8333
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, valkey: { condition: service_healthy }, storage: { condition: service_healthy } }

  realtime:
    profiles: ["services"]
    build: { context: ., args: { APP: realtime } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://contestly:contestly@postgres:5432/contestly
      REDIS_URL: redis://valkey:6379
    ports: ["4001:4001"]
    depends_on: { postgres: { condition: service_healthy }, valkey: { condition: service_healthy } }

  worker:
    profiles: ["services"]
    build: { context: ., args: { APP: worker } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://contestly:contestly@postgres:5432/contestly
      REDIS_URL: redis://valkey:6379
    depends_on: { postgres: { condition: service_healthy }, valkey: { condition: service_healthy } }

  questions:
    profiles: ["services"]
    build: { context: ., args: { APP: questions } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://contestly:contestly@postgres:5432/contestly
      REDIS_URL: redis://valkey:6379
      S3_ENDPOINT: http://storage:8333
    depends_on: { postgres: { condition: service_healthy }, valkey: { condition: service_healthy }, storage: { condition: service_healthy } }

volumes:
  pgdata:
  valkeydata:
  storagedata:
