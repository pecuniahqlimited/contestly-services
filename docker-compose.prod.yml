# Production on one droplet: the four services behind Caddy (HTTPS + WSS). Postgres and Valkey are
# DO Managed clusters, reached through DATABASE_URL / REDIS_URL in .env (see .env.production.example).
#
# A push to main deploys through .github/workflows/deploy.yml: images built in CI, pulled here by tag
# (IMAGE_REGISTRY and IMAGE_TAG in .env), then scripts/deploy.sh. By hand, building here instead:
#
#   docker compose -f docker-compose.prod.yml build api realtime worker questions
#   docker compose -f docker-compose.prod.yml stop api realtime worker questions
#   docker compose -f docker-compose.prod.yml --profile tools run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
name: contestly

x-service: &service
  env_file: .env
  restart: unless-stopped
  # Four services plus Caddy fit a 2 GB droplet.
  mem_limit: 384m

services:
  api:
    <<: *service
    build: { context: ., args: { APP: api } }
    image: ${IMAGE_REGISTRY:-local}/contestly-api:${IMAGE_TAG:-latest}

  realtime:
    <<: *service
    build: { context: ., args: { APP: realtime } }
    image: ${IMAGE_REGISTRY:-local}/contestly-realtime:${IMAGE_TAG:-latest}

  worker:
    <<: *service
    build: { context: ., args: { APP: worker } }
    image: ${IMAGE_REGISTRY:-local}/contestly-worker:${IMAGE_TAG:-latest}

  questions:
    <<: *service
    build: { context: ., args: { APP: questions } }
    image: ${IMAGE_REGISTRY:-local}/contestly-questions:${IMAGE_TAG:-latest}
    # Generation holds model replies, embeddings and drafts in memory; Node's default heap at 384m ran out.
    mem_limit: 640m
    environment:
      NODE_OPTIONS: --max-old-space-size=480

  # The only container with public ports. Gets TLS certificates for API_HOST and RT_HOST on first request.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
      RT_HOST: ${RT_HOST:?set RT_HOST in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [api, realtime]

  # Test servers only (NODE_ENV=development, EMAIL_TRANSPORT=mailpit): sign-in codes land in an inbox at
  # https://<API_HOST>/mail/ behind MAILPIT_UI_AUTH. Start it with --profile mock.
  mailpit:
    profiles: ["mock"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_WEBROOT: mail
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}
      # The API posts mail without credentials; the send endpoint is reachable only inside the compose network.
      MP_SEND_API_AUTH_ACCEPT_ANY: "true"
      MP_MAX_MESSAGES: 500

  # One-off: applies packages/db/drizzle migrations to DATABASE_URL, from the release's api image (it carries
  # the migrations and drizzle-kit), so it always matches the code about to start.
  migrate:
    profiles: ["tools"]
    image: ${IMAGE_REGISTRY:-local}/contestly-api:${IMAGE_TAG:-latest}
    env_file: .env
    command: ["npm", "run", "db:migrate"]

volumes:
  caddydata:
