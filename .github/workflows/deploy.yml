# A push to main: typecheck and unit tests, then the four images to DigitalOcean Container Registry, then
# scripts/deploy.sh on the droplet over SSH (pull → stop → migrate → start). Setup and the settings it reads:
# docs/engineering/deploy-notes.md, "Continuous deploy".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order: a later push waits instead of cancelling one mid-migration.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: registry.digitalocean.com/${{ vars.DO_REGISTRY }}

jobs:
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # the prepare script builds the shared packages
      - run: npm run typecheck
      - run: npm test

  images:
    name: Image (${{ matrix.app }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, realtime, worker, questions]
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl registry login --expiry-seconds 1800
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ env.REGISTRY }}/contestly-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to the droplet
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key and the droplet's host key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' > ~/.ssh/config
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # Read-only and expiring: the droplet never holds the DigitalOcean token, and deploy.sh deletes this.
      - name: Registry login for the droplet (read-only, 15 minutes)
        run: |
          doctl registry docker-config --expiry-seconds 900 \
            | ssh "$TARGET" 'umask 077 && mkdir -p ~/.contestly-deploy && cat > ~/.contestly-deploy/config.json'
      - name: Pull, stop, migrate, start
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: ssh "$TARGET" bash -s -- "$GITHUB_SHA" "$REGISTRY" "$DEPLOY_PATH" < scripts/deploy.sh
